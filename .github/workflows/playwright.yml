name: Playwright Tests
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Clone Real World App next to this repo
      run: git clone --depth 1 --branch develop https://github.com/sanzc3-source/cypress-realworld-app.git ../cypress-realworld-app
    - name: Run tests in Docker Compose
      run: docker compose up --build --abort-on-container-exit --exit-code-from playwright
    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: |
          playwright-report/
          test-results/
        retention-days: 30
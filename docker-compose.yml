services:
  sut:
    build:
      context: ../cypress-realworld-app
    ports:
      - "3000:3000"
      - "3001:3001"
    healthcheck:
      test: ["CMD", "node", "-e", "Promise.all([fetch('http://127.0.0.1:3000'), fetch('http://127.0.0.1:3001')]).then(() => process.exit(0)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 10s
    networks:
      - test-net

  playwright:
    build:
      context: .
    depends_on:
      sut:
        condition: service_healthy
    environment:
      - BASE_URL=http://sut:3000
    volumes:
      - ./playwright-report:/app/playwright-report
      - ./test-results:/app/test-results
    networks:
      - test-net

networks:
  test-net:
    driver: bridge